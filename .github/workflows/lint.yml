name: Lint chart

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CHART: charts/speech-container
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: helm lint
        run: helm lint "$CHART" --set secretRef.enabled=true

      - name: helm template (every example, alone and with every overlay)
        run: |
          set -euo pipefail
          for ex in stt-hi stt-other tts-hi tts-other; do
            # The non-Hindi base files set no language: pass one (Marathi here).
            lang=()
            case "$ex" in
              stt-other) lang=(--set image.tag=5.3.0-amd64-mr-in --set gatewayApi.path=/stt/mr-IN) ;;
              tts-other) lang=(--set image.tag=4.9.0-amd64-mr-in-aarohineural --set gatewayApi.path=/tts/mr-IN) ;;
            esac
            for ov in "" values-gateway-route agc-overrides internal-lb prod-overrides; do
              args=(-f "$CHART/examples/$ex.yaml")
              [ -n "$ov" ] && args+=(-f "$CHART/examples/$ov.yaml")
              echo "::group::$ex ${ov:-(no overlay)}"
              helm template test "$CHART" "${args[@]}" ${lang[@]+"${lang[@]}"} \
                --set secretRef.enabled=true --set secretRef.name=test \
                --set gatewayApi.hostname=speech.contoso.com > /dev/null
              echo "::endgroup::"
            done
          done

      - name: helm template (option combinations)
        run: |
          set -euo pipefail
          base=(--set secretRef.enabled=true)
          # Key Vault, add-on identity (chart creates the SecretProviderClass)
          helm template t "$CHART" "${base[@]}" \
            --set secretProviderClass.enabled=true \
            --set secretProviderClass.keyVaultName=kv \
            --set secretProviderClass.tenantId=tid \
            --set secretProviderClass.clientId=cid | grep -q 'kind: SecretProviderClass'
          # Key Vault, workload identity
          helm template t "$CHART" "${base[@]}" \
            --set secretProviderClass.enabled=true \
            --set secretProviderClass.identity=workload \
            --set secretProviderClass.keyVaultName=kv \
            --set secretProviderClass.tenantId=tid \
            --set secretProviderClass.clientId=cid | grep -q 'azure.workload.identity/use: "true"'
          # Key Vault, existing shared SecretProviderClass
          helm template t "$CHART" "${base[@]}" \
            --set secretProviderClass.enabled=true \
            --set secretProviderClass.create=false \
            --set secretProviderClass.name=shared | grep -q 'secretProviderClass: shared'
          # Required node affinity, pull-secret alias, liveness on /status
          helm template t "$CHART" "${base[@]}" --set nodePool=stt-hi \
            --set nodePoolAffinity=required | grep -q requiredDuringSchedulingIgnoredDuringExecution
          helm template t "$CHART" "${base[@]}" \
            --set 'imagePullSecrets[0].name=acr' | grep -q 'name: acr'
          helm template t "$CHART" "${base[@]}" --set livenessProbe.type=httpGet | grep -q 'path: /status'
          # TTS must not get the STT-only DECODER_MAX_COUNT
          ! helm template t "$CHART" -f "$CHART/examples/tts-hi.yaml" "${base[@]}" | grep -q DECODER_MAX_COUNT

      - name: helm template (invalid values must fail)
        run: |
          set -uo pipefail
          expect_fail() {
            if helm template t "$CHART" --set secretRef.enabled=true "$@" > /dev/null 2>&1; then
              echo "::error::expected failure for: $*"; exit 1
            fi
          }
          expect_fail --set imagePullSecret=typo              # unknown key (schema)
          expect_fail --set mode=asr                          # bad enum (schema)
          expect_fail --set nodePool=x --set nodePoolAffinity=hard
          expect_fail --set preStopSleepSeconds=60 --set terminationGracePeriodSeconds=30
          expect_fail --set secretProviderClass.enabled=true  # missing Key Vault name / tenant / client ID
          expect_fail --set gatewayApi.enabled=true --set gatewayApi.parentRef.name=gw \
            --set gatewayApi.path=/stt/en-US                   # no hostname
          expect_fail -f "$CHART/examples/stt-hi.yaml" -f "$CHART/examples/values-gateway-route.yaml"
          expect_fail --set ingress.enabled=true --set ingress.path=/stt/hi-IN   # no ingress.host
          # Non-Hindi base files: image.tag is required, must match the mode, and a route needs a path
          expect_fail -f "$CHART/examples/stt-other.yaml"
          expect_fail -f "$CHART/examples/tts-other.yaml"
          expect_fail -f "$CHART/examples/stt-other.yaml" --set image.tag=4.9.0-amd64-mr-in-aarohineural
          expect_fail -f "$CHART/examples/tts-other.yaml" --set image.tag=5.3.0-amd64-mr-in
          expect_fail -f "$CHART/examples/stt-other.yaml" -f "$CHART/examples/values-gateway-route.yaml" \
            --set image.tag=5.3.0-amd64-mr-in --set gatewayApi.hostname=speech.contoso.com
          out=$(helm template t "$CHART" -f "$CHART/examples/stt-other.yaml" --set secretRef.enabled=true 2>&1 || true)
          grep -q 'image.tag is required' <<<"$out" || { echo "::error::missing image.tag must say so"; exit 1; }

      - name: Gateway manifests match the route overlay
        run: |
          set -euo pipefail
          ov="$CHART/examples/values-gateway-route.yaml"
          test -z "$(yq '.gatewayApi.parentRef.namespace' "$ov")"     # empty = release namespace
          test -z "$(yq '.gatewayApi.parentRef.sectionName' "$ov")"   # attach to either Gateway's listener
          for gw in "$CHART/examples/gateway-public.yaml" "$CHART/examples/gateway-internal.yaml"; do
            test "$(yq '.kind' "$gw")" = Gateway
            test "$(yq '.metadata.name' "$gw")" = "$(yq '.gatewayApi.parentRef.name' "$ov")"
            test "$(yq '.metadata.namespace' "$gw")" = null          # namespace comes from kubectl -n
          done
          test "$(yq '.spec.listeners[0].protocol' "$CHART/examples/gateway-public.yaml")" = HTTPS
          test "$(yq '.spec.listeners[0].protocol' "$CHART/examples/gateway-internal.yaml")" = HTTP
          test "$(yq '.spec.infrastructure.annotations["service.beta.kubernetes.io/azure-load-balancer-internal"]' "$CHART/examples/gateway-internal.yaml")" = true

      - name: Image tags exist on MCR
        run: |
          set -euo pipefail
          # MCR allows anonymous manifest reads; HEAD returns 200 if the tag exists, 404 if not.
          check() {
            local repo=$1 tag=$2
            if curl -fsSI -o /dev/null \
                -H 'Accept: application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
                "https://mcr.microsoft.com/v2/$repo/manifests/$tag"; then
              echo "ok  $repo:$tag"
            else
              echo "::error::missing on MCR: $repo:$tag"; return 1
            fi
          }
          stt=azure-cognitive-services/speechservices/speech-to-text
          tts=azure-cognitive-services/speechservices/neural-text-to-speech
          check "$stt" "$(yq '.image.tag' "$CHART/values.yaml")"
          # stt-other.yaml / tts-other.yaml leave image.tag empty on purpose
          for f in "$CHART"/examples/stt-*.yaml; do
            t=$(yq '.image.tag' "$f"); if [ -n "$t" ]; then check "$stt" "$t"; fi
          done
          for f in "$CHART"/examples/tts-*.yaml; do
            t=$(yq '.image.tag' "$f"); if [ -n "$t" ]; then check "$tts" "$t"; fi
          done
          # Every full image tag written in the chart README must exist too.
          mapfile -t tags < <(grep -oE '[0-9]+\.[0-9]+\.[0-9]+-amd64-[a-z]{2}-[a-z]{2}(-[a-z]+neural)?' "$CHART/README.md" | sort -u)
          for t in "${tags[@]}"; do
            case "$t" in *neural) check "$tts" "$t" ;; *) check "$stt" "$t" ;; esac
          done
