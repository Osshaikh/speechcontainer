apiVersion: v2
name: speech-container
type: application
version: 1.2.12
appVersion: "5.3.0"
description: |
  Helm chart for deploying Azure AI Speech disconnected containers (Speech-to-Text
  and Neural Text-to-Speech) on any Kubernetes platform. Fully parameterised CPU
  and memory (request + limit) per container, aligned with Microsoft Learn
  host-resource recommendations. First-class AKS guidance with platform-neutral
  defaults.
home: https://github.com/Osshaikh/speechcontainer
sources:
  - https://github.com/Osshaikh/speechcontainer
keywords:
  - azure
  - speech
  - stt
  - tts
  - text-to-speech
  - speech-to-text
  - cognitive-services
  - disconnected
  - aks
  - kubernetes
maintainers:
  - name: Osama Shaikh
    email: osshaikh@microsoft.com
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/Osshaikh/speechcontainer
    - name: Documentation
      url: https://github.com/Osshaikh/speechcontainer/blob/main/charts/speech-container/README.md
