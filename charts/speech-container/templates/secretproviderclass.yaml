{{- if and .Values.secretProviderClass.enabled .Values.secretProviderClass.create -}}
{{- $spc := .Values.secretProviderClass -}}
{{- if not (has $spc.identity (list "addon" "workload")) -}}
{{- fail (printf "secretProviderClass.identity must be 'addon' or 'workload', got %q" $spc.identity) -}}
{{- end -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "speech-container.secretProviderClassName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "speech-container.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    {{- if eq $spc.identity "addon" }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ required "secretProviderClass.clientId is required: client ID of the AKS azureKeyvaultSecretsProvider add-on identity" $spc.clientId | quote }}
    {{- else }}
    clientID: {{ required "secretProviderClass.clientId is required: client ID of the workload identity" $spc.clientId | quote }}
    {{- end }}
    keyvaultName: {{ required "secretProviderClass.keyVaultName is required" $spc.keyVaultName | quote }}
    tenantId: {{ required "secretProviderClass.tenantId is required" $spc.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ $spc.billingSecretName }}
          objectType: secret
        - |
          objectName: {{ $spc.apiKeySecretName }}
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.secretRef.name }}
      type: Opaque
      data:
        - objectName: {{ $spc.billingSecretName }}
          key: {{ .Values.secretRef.billingKey }}
        - objectName: {{ $spc.apiKeySecretName }}
          key: {{ .Values.secretRef.apiKeyKey }}
{{- end }}
