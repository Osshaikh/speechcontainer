{{- if and .Values.gatewayApi.enabled .Values.ingress.enabled -}}
{{- fail "ingress.enabled and gatewayApi.enabled are mutually exclusive. Pick one routing layer per release (Ingress for nginx-style controllers, gatewayApi for the AKS application routing add-on, Application Gateway for Containers or any Gateway API implementation)." -}}
{{- end -}}
{{- if .Values.gatewayApi.enabled -}}
{{- $svcName := include "speech-container.fullname" . -}}
{{- $svcPort := .Values.service.port | int -}}
{{- $path := .Values.gatewayApi.path | required "gatewayApi.path is required when gatewayApi.enabled=true: the route path of this language, e.g. --set gatewayApi.path=/stt/mr-IN (STT) or /tts/mr-IN (TTS)" -}}
{{- $parentName := .Values.gatewayApi.parentRef.name | required "gatewayApi.parentRef.name is required (the name of the existing parent Gateway resource)" -}}
{{- $parentNs := default .Release.Namespace .Values.gatewayApi.parentRef.namespace -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $svcName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "speech-container.labels" . | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $parentName }}
      namespace: {{ $parentNs }}
      {{- with .Values.gatewayApi.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- $hostnames := concat (list .Values.gatewayApi.hostname) (.Values.gatewayApi.hostnames | default list) | compact | uniq }}
  {{- if not $hostnames }}
  {{- fail "gatewayApi.hostname or gatewayApi.hostnames is required when gatewayApi.enabled=true" }}
  {{- end }}
  hostnames:
    {{- range $hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}
      # Strip the language prefix before forwarding so the container sees its
      # native URL structure (matches nginx-ingress rewrite-target behaviour).
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- with .Values.gatewayApi.timeouts }}
      timeouts:
        {{- if .request }}
        request: {{ .request | quote }}
        {{- end }}
        {{- if .backendRequest }}
        backendRequest: {{ .backendRequest | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
{{- end }}
