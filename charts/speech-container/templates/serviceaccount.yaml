{{- if .Values.serviceAccount.create -}}
{{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) -}}
{{- if include "speech-container.useWorkloadIdentity" . -}}
{{- $_ := set $annotations "azure.workload.identity/client-id" (required "secretProviderClass.clientId is required when secretProviderClass.identity=workload" .Values.secretProviderClass.clientId) -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "speech-container.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "speech-container.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end -}}
