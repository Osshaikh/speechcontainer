{{- /* Rendered only when the release keeps at least 2 replicas; with 1 replica a
       minAvailable: 1 budget would block every node drain and AKS upgrade. */}}
{{- $minReplicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled | int }}
{{- if and .Values.podDisruptionBudget.enabled (ge $minReplicas 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "speech-container.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "speech-container.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "speech-container.selectorLabels" . | nindent 6 }}
{{- end }}
