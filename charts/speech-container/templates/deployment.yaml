{{- if and .Values.secretProviderClass.enabled (not .Values.secretRef.enabled) -}}
{{- fail "secretProviderClass.enabled=true requires secretRef.enabled=true: the Key Vault provider syncs the billing URL and API key into the Secret named by secretRef.name" -}}
{{- end -}}
{{- if and (gt (int .Values.preStopSleepSeconds) 0) (le (int .Values.terminationGracePeriodSeconds) (int .Values.preStopSleepSeconds)) -}}
{{- fail "terminationGracePeriodSeconds must be greater than preStopSleepSeconds, otherwise the pod is killed before the preStop sleep ends" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "speech-container.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "speech-container.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "speech-container.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "speech-container.labels" . | nindent 8 }}
        {{- if include "speech-container.useWorkloadIdentity" . }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "speech-container.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "speech-container.imagePullSecrets" .) }}
      imagePullSecrets: {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "speech-container.tolerations" .) }}
      tolerations: {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "speech-container.affinity" .) }}
      affinity: {{- . | nindent 8 }}
      {{- end }}
      {{- with (include "speech-container.topologySpreadConstraints" .) }}
      topologySpreadConstraints: {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.mode }}
          image: {{ include "speech-container.image.full" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "Eula={{ .Values.args.eula }}"
            {{- if .Values.secretRef.enabled }}
            - "Billing=$(BILLING_ENDPOINT)"
            - "ApiKey=$(BILLING_APIKEY)"
            {{- else }}
            - "Billing={{ required "args.billing is required (or enable secretRef)" .Values.args.billing }}"
            - "ApiKey={{ required "args.apikey is required (or enable secretRef)" .Values.args.apikey }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
          {{- end }}
          env:
            {{- if eq .Values.mode "stt" }}
            - name: DECODER_MAX_COUNT
              value: "{{ .Values.concurrency.numberOfConcurrentRequest }}"
            {{- end }}
            {{- if .Values.secretRef.enabled }}
            - name: BILLING_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: {{ .Values.secretRef.billingKey }}
            - name: BILLING_APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: {{ .Values.secretRef.apiKeyKey }}
            {{- end }}
            {{- with .Values.env.extra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- if eq .Values.livenessProbe.type "tcpSocket" }}
            tcpSocket:
              port: http
            {{- else if eq .Values.livenessProbe.type "httpGet" }}
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            {{- else }}
            {{- fail (printf "livenessProbe.type must be 'tcpSocket' or 'httpGet', got %q" .Values.livenessProbe.type) }}
            {{- end }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.secretProviderClass.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: {{ .Values.secretProviderClass.mountPath }}
              readOnly: true
          {{- end }}
      {{- if .Values.secretProviderClass.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "speech-container.secretProviderClassName" . }}
      {{- end }}
