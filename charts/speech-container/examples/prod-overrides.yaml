# =============================================================================
# Single-pool override — collapse STT and TTS onto ONE shared "speech" pool.
#
# By default, the examples target four pools: stt-hi, stt-other, tts-hi and
# tts-other (recommended for prod — Hindi and non-Hindi workloads isolated).
# If you want to run everything on one pool instead, layer this file on top:
#
#   helm install stt-en osshaikh/speech-container \
#     -f stt-en.yaml \
#     -f prod-overrides.yaml
#
# This REPLACES the example's nodePool with a single shared "workload=speech"
# target. For two pools (workload=stt / workload=tts), set nodePool: stt or
# nodePool: tts per release instead.
# =============================================================================

nodePool: speech

# The stt-*/tts-* examples set nodePoolAffinity: required, so pods never leave
# the shared pool. To allow fallback to other untainted nodes instead:
# nodePoolAffinity: preferred

# ---- Optional: tighten or loosen unified resource defaults ------------------
# resources:
#   requests: { cpu: "12", memory: "12Gi" }
#   limits:   { cpu: "16", memory: "24Gi" }
