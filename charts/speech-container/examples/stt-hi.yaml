mode: stt

image:
  tag: 5.3.0-amd64-hi-in

# STT minimum sizing per Microsoft Learn host-resource guidance.
# Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "4"
    memory: "4Gi"

# Decoders = concurrent sessions per pod. Each decoder needs ~0.7-1.25 CPU.
# For a 4-core request, 5 decoders keeps each decoder CPU-fed (low latency).
# Raise to 8 only if you also raise resources.requests.cpu to 8.
concurrency:
  numberOfConcurrentRequest: 5

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /stt/hi-IN

# ---- Pod scheduling: dedicated STT nodepool ---------------------------------
# Expects nodes tainted workload=stt:NoSchedule and labeled workload=stt.
# Soft affinity = prefers STT pool, falls back to any untainted node if STT
# pool is unavailable. See stt-en.yaml for full rationale.
tolerations:
  - key: workload
    operator: Equal
    value: stt
    effect: NoSchedule

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values: ["stt"]
