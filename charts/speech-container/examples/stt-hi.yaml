mode: stt

image:
  tag: 5.3.0-amd64-hi-in

# STT minimum sizing per Microsoft Learn host-resource guidance.
# Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "4"
    memory: "4Gi"

# Decoders = concurrent sessions per pod. Each decoder needs ~0.7-1.25 CPU.
# For a 4-core request, 5 decoders keeps each decoder CPU-fed (low latency).
# Raise to 8 only if you also raise resources.requests.cpu to 8.
concurrency:
  numberOfConcurrentRequest: 5

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /stt/hi-IN

# ---- Pod scheduling: dedicated Hindi STT node pool --------------------------
# Pool tainted workload=stt-hi:NoSchedule and labelled workload=stt-hi.
# The chart adds the matching toleration + soft node affinity (see stt-en.yaml).
nodePool: stt-hi
