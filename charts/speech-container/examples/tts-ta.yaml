mode: tts

image:
  # Voice: PallaviNeural (ta-IN female). Other ta-IN voices: ValluvarNeural (male).
  # All TTS locales now standardize on 4.7.0. New locales (ta, mr, te, bn, gu, kn, ml, pa, ur, ...) ship ONLY on 4.7.0.
  tag: 4.7.0-amd64-ta-in-pallavineural

# Neural TTS minimum sizing per Microsoft Learn host-resource guidance.
# Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "6"
    memory: "12Gi"

concurrency:
  numberOfConcurrentRequest: 6

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 60

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /tts/ta-IN

# Pod scheduling: dedicated TTS nodepool (workload=tts taint + label).
tolerations:
  - key: workload
    operator: Equal
    value: tts
    effect: NoSchedule

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values: ["tts"]
