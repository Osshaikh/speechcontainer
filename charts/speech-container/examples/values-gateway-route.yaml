# =============================================================================
#  values-gateway-route.yaml: expose a release through AKS app routing
#  (Gateway API, gatewayClassName approuting-istio)
# -----------------------------------------------------------------------------
#  Recommended route on AKS. Layer it on top of any stt-*.yaml / tts-*.yaml
#  example; the example already sets gatewayApi.path (/stt/<locale> or
#  /tts/<locale>), so each release gets its own path on the shared hostname.
#
#    helm upgrade --install stt-en speech-container/speech-container -n speech \
#      --version 1.4.2 \
#      -f examples/stt-en.yaml \
#      -f examples/values-gateway-route.yaml \
#      --set secretRef.enabled=true \
#      --set gatewayApi.hostname=speech.contoso.com     # REQUIRED
#
#  This is a Helm values file, not a Kubernetes manifest: pass it to helm with
#  -f, don't kubectl apply it. The Gateway it attaches to is a separate manifest,
#  examples/gateway.yaml, applied once into the releases' namespace (chart
#  README, Deploy step 3). gatewayApi.parentRef below must match that Gateway.
#
#  Clients call the path-routed URL with the Speech SDK `endpoint` parameter
#  (the SDK `host` parameter does not accept a path):
#    STT  wss://speech.contoso.com/stt/en-US/speech/recognition/conversation/cognitiveservices/v1
#    TTS  https://speech.contoso.com/tts/en-US/cognitiveservices/v1
# =============================================================================

ingress:
  enabled: false

gatewayApi:
  enabled: true
  parentRef:
    name: speech-gateway            # your shared Gateway
    namespace: ""                   # empty = the release namespace, where gateway.yaml is applied
    sectionName: https              # listener name on the Gateway
  # REQUIRED: set with --set gatewayApi.hostname=<your hostname>. It must match
  # the Gateway listener hostname; requests with any other Host header get 404.
  # Left empty on purpose, so a forgotten hostname fails the install instead of
  # creating a route nobody can reach. Extra names go under `hostnames`.
  hostname: ""
  hostnames: []
  # Long-lived STT WebSocket sessions: 1 hour per request.
  timeouts:
    request: "3600s"
    backendRequest: "3600s"
