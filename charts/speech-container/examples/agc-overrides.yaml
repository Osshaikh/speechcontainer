# =============================================================================
#  Example: Application Gateway for Containers (AGC) on AKS
# -----------------------------------------------------------------------------
#  Use this overlay when you've installed the ALB Controller and provisioned
#  an ApplicationLoadBalancer + Gateway on your AKS cluster. Layer on top of
#  any stt-*.yaml / tts-*.yaml example (the example sets gatewayApi.path):
#
#    helm upgrade --install stt-hi speech-container/speech-container -n speech \
#      --version 1.5.1 \
#      -f examples/stt-hi.yaml \
#      -f examples/agc-overrides.yaml \
#      --set secretRef.enabled=true \
#      --set gatewayApi.hostname=speech.contoso.com
#
#  For most AKS clusters, prefer values-gateway-route.yaml (AKS app routing,
#  Gateway API). The HTTPRoute is the same; only the parent Gateway differs.
#
#  Pre-requisites (one-time, cluster-wide; follow the Microsoft Learn
#  "Application Gateway for Containers" quickstart):
#    1. Install the ALB Controller
#    2. Create the ApplicationLoadBalancer custom resource
#    3. Create the parent Gateway resource (HTTP and/or HTTPS listener)
#    4. Set `gatewayApi.parentRef.name` (and namespace) to that Gateway
# =============================================================================

# Make sure the NGINX Ingress stays off
ingress:
  enabled: false

# Turn ON the Gateway API HTTPRoute
gatewayApi:
  enabled: true
  parentRef:
    name: speech-gateway              # rename to match your Gateway resource
    namespace: speech                 # namespace where the Gateway lives
    # sectionName: https              # optional: pin to a specific Gateway listener
  hostname: ""                       # REQUIRED: --set gatewayApi.hostname=<host accepted by the Gateway listener>
  # path comes from the stt-*/tts-* example (/stt/<locale> or /tts/<locale>)
  timeouts:
    request: "3600s"                  # AGC supports per-route timeouts (Gateway API v1.1+)
    backendRequest: "3600s"
  annotations: {}
    # AGC-specific tuning (uncomment as needed)
    # alb.networking.azure.io/access-log: enabled
