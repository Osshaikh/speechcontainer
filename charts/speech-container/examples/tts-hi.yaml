mode: tts

image:
  # Voice: SwaraNeural (hi-IN female). Alternatives: madhurneural (M), aartineural (F)
  tag: 4.7.0-amd64-hi-in-swaraneural

# Neural TTS minimum sizing per Microsoft Learn host-resource guidance.
# Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "6"
    memory: "12Gi"

concurrency:
  numberOfConcurrentRequest: 6

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /tts/hi-IN

# ---- Pod scheduling: dedicated Hindi TTS node pool --------------------------
# Pool tainted workload=tts-hi:NoSchedule and labelled workload=tts-hi.
# The chart adds the matching toleration + soft node affinity (see tts-en.yaml).
nodePool: tts-hi
