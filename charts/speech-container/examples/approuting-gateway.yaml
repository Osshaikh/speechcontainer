# =============================================================================
#  approuting-gateway.yaml: expose a release through AKS app routing
#  (Gateway API, gatewayClassName approuting-istio)
# -----------------------------------------------------------------------------
#  Recommended route on AKS. Layer it on top of any stt-*.yaml / tts-*.yaml
#  example; the example already sets gatewayApi.path (/stt/<locale> or
#  /tts/<locale>), so each release gets its own path on the shared hostname.
#
#    helm upgrade --install stt-en speech-container/speech-container -n speech \
#      --version 1.4.0 \
#      -f examples/stt-en.yaml \
#      -f examples/approuting-gateway.yaml \
#      --set secretRef.enabled=true \
#      --set gatewayApi.hostname=speech.contoso.com
#
#  One-time cluster setup (not created by this chart). See chart README
#  "Routing with AKS app routing (Gateway API)":
#    1. Enable app routing with Gateway API (Istio-based) on the cluster.
#    2. Create a TLS Secret for the hostname in the Gateway namespace.
#    3. Create ONE shared Gateway, for example:
#
#       apiVersion: gateway.networking.k8s.io/v1
#       kind: Gateway
#       metadata:
#         name: speech-gateway
#         namespace: speech
#       spec:
#         gatewayClassName: approuting-istio
#         # Internal (private) load balancer instead of a public IP:
#         # infrastructure:
#         #   annotations:
#         #     service.beta.kubernetes.io/azure-load-balancer-internal: "true"
#         listeners:
#           - name: https
#             hostname: speech.contoso.com
#             port: 443
#             protocol: HTTPS
#             tls:
#               mode: Terminate
#               certificateRefs:
#                 - kind: Secret
#                   name: speech-tls
#             allowedRoutes:
#               namespaces:
#                 from: Same
#
#  Clients call the path-routed URL with the Speech SDK `endpoint` parameter
#  (the SDK `host` parameter does not accept a path):
#    STT  wss://speech.contoso.com/stt/en-US/speech/recognition/conversation/cognitiveservices/v1
#    TTS  https://speech.contoso.com/tts/en-US/cognitiveservices/v1
# =============================================================================

ingress:
  enabled: false

gatewayApi:
  enabled: true
  parentRef:
    name: speech-gateway            # your shared Gateway
    namespace: speech               # namespace of the Gateway
    sectionName: https              # listener name on the Gateway
  # Must match the Gateway listener hostname. Add more names (for example a
  # private DNS name) under `hostnames`; every name must be accepted by the
  # listener, and requests with any other Host header get 404.
  hostname: speech.example.com
  hostnames: []
  # Long-lived STT WebSocket sessions: 1 hour per request.
  timeouts:
    request: "3600s"
    backendRequest: "3600s"
