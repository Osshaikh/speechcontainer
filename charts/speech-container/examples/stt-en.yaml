mode: stt

image:
  tag: 5.3.0-amd64-en-us

# STT minimum sizing per Microsoft Learn host-resource guidance.
# Request = guaranteed scheduling floor. Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "4"
    memory: "4Gi"

concurrency:
  numberOfConcurrentRequest: 8

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /stt/en-US

# ---- Pod scheduling: shared non-Hindi STT node pool -------------------------
# Every non-Hindi STT language (en-US, ta-IN, ...) shares one pool, prepared as:
#   az aks nodepool add ... --name sttother \
#     --node-taints workload=stt-other:NoSchedule \
#     --labels workload=stt-other
# The chart turns `nodePool` into:
#   - a toleration       -> lets this pod LAND on the stt-other tainted nodes
#   - soft nodeAffinity  -> PREFERS stt-other nodes (weight 100), falls back to
#     any untainted node if the pool is unavailable (avoids stuck Pending)
# Two-pool cluster (workload=stt)? Set nodePool: stt instead.
nodePool: stt-other
