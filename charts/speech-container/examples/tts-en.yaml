mode: tts

image:
  # Voice: AvaNeural (en-US female). Latest tag verified on MCR.
  tag: 4.7.0-amd64-en-us-avaneural

# Neural TTS minimum sizing per Microsoft Learn host-resource guidance.
# Neural voices need more CPU + memory than STT for waveform synthesis.
# Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "6"
    memory: "12Gi"

concurrency:
  numberOfConcurrentRequest: 6

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /tts/en-US

# ---- Pod scheduling: shared non-Hindi TTS node pool -------------------------
# Every non-Hindi TTS voice (en-US, ta-IN, ...) shares one pool, prepared as:
#   az aks nodepool add ... --name ttsother \
#     --node-taints workload=tts-other:NoSchedule \
#     --labels workload=tts-other
# The chart turns `nodePool` into:
#   - a toleration       -> lets this pod LAND on the tts-other tainted nodes
#   - soft nodeAffinity  -> PREFERS tts-other nodes (weight 100), falls back to
#     any untainted node if the pool is unavailable (avoids stuck Pending)
# Two-pool cluster (workload=tts)? Set nodePool: tts instead.
nodePool: tts-other
