# =============================================================================
#  gateway-public.yaml: shared Gateway with a PUBLIC IP, HTTPS on port 443
# -----------------------------------------------------------------------------
#  A Kubernetes manifest (kubectl apply), not a Helm values file. Apply it once,
#  into the namespace of the speech releases, after creating the TLS Secret
#  `speech-tls` there. It has no namespace of its own: kubectl -n sets it.
#
#    1. Change `hostname` below to your hostname (it must match the certificate
#       and the --set gatewayApi.hostname you pass to helm).
#    2. kubectl create secret tls speech-tls -n speech --cert=speech.crt --key=speech.key
#    3. kubectl apply -n speech -f examples/gateway-public.yaml
#
#  Clients call https:// (TTS) and wss:// (STT).
#  Private IP and no TLS instead: use examples/gateway-internal.yaml.
#  Requires AKS app routing with Gateway API:
#    az aks update -g <rg> -n <aks> --enable-gateway-api --enable-app-routing-istio
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: speech-gateway
spec:
  gatewayClassName: approuting-istio
  listeners:
    - name: https
      hostname: speech.contoso.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: speech-tls
      allowedRoutes:
        namespaces:
          from: Same
