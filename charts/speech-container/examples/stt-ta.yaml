mode: stt

image:
  tag: 5.3.0-amd64-ta-in

# STT minimum sizing per Microsoft Learn host-resource guidance.
# Request = guaranteed scheduling floor. Limits inherit from chart values.yaml (8c / 16Gi).
resources:
  requests:
    cpu: "4"
    memory: "4Gi"

concurrency:
  numberOfConcurrentRequest: 8

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 80
  targetCPUUtilizationPercentage: 75

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: nginx
  host: speech.example.com
  path: /stt/ta-IN

# Pod scheduling: shared non-Hindi STT pool (workload=stt-other taint + label).
nodePool: stt-other
